<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CredSeek · Billing Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Oxanium:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #081018; --panel: #0f1c28; --line: rgba(148,163,184,.25);
        --text: #e5eef5; --muted: #93a4b3; --accent: #2dd4bf; --accent2: #60a5fa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Outfit, sans-serif; color: var(--text); background: linear-gradient(160deg,#071019,#0c1824 50%,#0a141d); min-height: 100vh; }
      .wrap { width: min(1200px, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 3rem; }
      h1 { font-family: Oxanium, Outfit, sans-serif; margin: 0 0 .4rem; }
      .muted { color: var(--muted); }
      .row { display: grid; grid-template-columns: 1.1fr .9fr; gap: 1rem; }
      @media (max-width: 950px) { .row { grid-template-columns: 1fr; } }
      .card { background: rgba(15,28,40,.9); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; }
      input, select, button, textarea {
        width: 100%; padding: .65rem .75rem; border-radius: 10px; border: 1px solid var(--line);
        background: #0a1520; color: var(--text); font: inherit; margin: .25rem 0 .6rem;
      }
      button { background: linear-gradient(120deg,var(--accent),var(--accent2)); color: #042017; font-weight: 700; border: 0; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; font-size: .9rem; }
      th, td { border-bottom: 1px solid var(--line); padding: .55rem .35rem; text-align: left; vertical-align: top; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: .78rem; color: var(--muted); }
      .pill { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .72rem; font-weight: 700; }
      .pill.ok { background: rgba(52,211,153,.15); color: #34d399; }
      .pill.no { background: rgba(251,113,133,.12); color: #fb7185; }
      .pill.trial { background: rgba(251,191,36,.14); color: #fbbf24; }
      .actions { display: flex; flex-wrap: wrap; gap: .35rem; }
      .actions button { width: auto; padding: .35rem .55rem; font-size: .78rem; }
      a { color: var(--accent2); }
      .appbar {
        display:flex; flex-wrap:wrap; gap:.55rem; align-items:center; justify-content:space-between;
        margin:0 0 1.1rem; padding:.75rem .9rem; border:1px solid var(--line); border-radius:14px;
        background:rgba(10,20,30,.85);
      }
      .appbar__brand { font-family:Oxanium,Outfit,sans-serif; font-weight:700; letter-spacing:.04em; }
      .appbar__nav { display:flex; flex-wrap:wrap; gap:.45rem; }
      .appbar__nav a {
        color:var(--text); text-decoration:none; font-size:.85rem; padding:.35rem .6rem; border-radius:8px;
        border:1px solid transparent;
      }
      .appbar__nav a:hover, .appbar__nav a.is-active {
        border-color:rgba(45,212,191,.35); background:rgba(45,212,191,.08); color:var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="appbar">
        <div class="appbar__brand">CREDSEEK</div>
        <nav class="appbar__nav" aria-label="App">
          <a href="/dashboard">Overview</a>
          <a href="/settings?tab=team">Accounts</a>
          <a class="is-active" href="/admin/billing">Billing &amp; Trial</a>
          <a href="/docs">API Docs</a>
          <a href="/subscribe">Subscribe</a>
        </nav>
      </div>
      <h1>Billing & Trial</h1>
      <p class="muted">Bagian admin CredSeek untuk trial client dan aktivasi langganan manual.</p>

      <div class="card" id="loginCard" style="margin:1rem 0; display:none;">
        <strong>Admin login</strong>
        <input id="email" placeholder="Email admin" />
        <input id="password" type="password" placeholder="Password" />
        <button id="loginBtn" type="button">Masuk</button>
        <div id="loginMsg" class="muted"></div>
      </div>

      <div class="row" id="app" style="display:none;margin-top:1rem;">
        <section class="card">
          <h3 style="margin-top:0;">Users</h3>
          <input id="q" placeholder="Cari nama/email" />
          <div style="overflow:auto; max-height:70vh;">
            <table>
              <thead><tr><th>User</th><th>Langganan</th><th></th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h3 style="margin-top:0;">Buat akun trial</h3>
          <input id="tName" placeholder="Nama" />
          <input id="tEmail" placeholder="Email" />
          <input id="tPass" type="password" placeholder="Password sementara" />
          <select id="tPlan"></select>
          <input id="tDays" type="number" min="1" value="7" placeholder="Hari trial" />
          <input id="tNote" placeholder="Catatan (opsional)" />
          <button id="createTrial" type="button">Buat trial</button>
          <div id="trialMsg" class="mono"></div>

          <h3>Aktivasi manual</h3>
          <input id="mUserId" placeholder="User ID" />
          <select id="mPlan"></select>
          <input id="mDays" type="number" min="1" value="30" />
          <div class="actions">
            <button data-act="activate" type="button">Aktifkan</button>
            <button data-act="trial" type="button">Set Trial</button>
            <button data-act="expire" type="button">Expire</button>
            <button data-act="clear" type="button">Clear</button>
          </div>
          <div id="manualMsg" class="mono"></div>
        </section>
      </div>
    </div>
    <script>
      const key = 'credseek_token'
      let token = localStorage.getItem(key) || ''
      let plans = []

      const headers = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' })
      async function api(path, opts={}) {
        const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers||{}) } })
        const data = await res.json().catch(()=>({}))
        if (!res.ok) throw new Error(data.error || ('HTTP '+res.status))
        return data
      }

      function pill(sub) {
        if (!sub) return '<span class="pill no">none</span>'
        if (sub.status === 'trial') return '<span class="pill trial">trial</span>'
        if (sub.active) return '<span class="pill ok">'+sub.status+'</span>'
        return '<span class="pill no">'+sub.status+'</span>'
      }

      function fillPlans(sel) {
        sel.innerHTML = plans.map(p => `<option value="${p.id}">${p.name} · Rp ${p.priceIdr} / ${p.durationDays}d</option>`).join('')
      }

      async function loadUsers() {
        const q = document.getElementById('q').value.trim()
        const data = await api('/api/admin/users-billing?limit=100&q=' + encodeURIComponent(q))
        plans = data.plans || []
        fillPlans(document.getElementById('tPlan'))
        fillPlans(document.getElementById('mPlan'))
        document.getElementById('tbody').innerHTML = data.users.map(u => `
          <tr>
            <td><strong>${u.name}</strong><div class="mono">${u.email}<br>${u.id}<br>role: ${u.role}</div></td>
            <td>${pill(u.subscription)}<div class="mono">${u.subscription?.planName || '-'}<br>${u.subscription?.expiresAt ? new Date(u.subscription.expiresAt).toLocaleString('id-ID') : '-'}</div></td>
            <td class="actions">
              <button type="button" data-fill="${u.id}">Pakai</button>
            </td>
          </tr>
        `).join('')
        document.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => {
          document.getElementById('mUserId').value = b.getAttribute('data-fill')
        })
      }

      document.getElementById('loginBtn').onclick = async () => {
        try {
          const data = await api('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value,
              rememberMe: true,
            }),
          })
          if (data.user.role !== 'admin') throw new Error('Hanya admin')
          token = data.token
          localStorage.setItem(key, token)
          document.getElementById('loginCard').style.display = 'none'
          document.getElementById('app').style.display = 'grid'
          await loadUsers()
        } catch (e) {
          document.getElementById('loginMsg').textContent = e.message
        }
      }

      document.getElementById('q').oninput = () => { clearTimeout(window.__t); window.__t = setTimeout(loadUsers, 300) }

      document.getElementById('createTrial').onclick = async () => {
        try {
          const data = await api('/api/admin/trial-users', {
            method: 'POST',
            body: JSON.stringify({
              name: document.getElementById('tName').value,
              email: document.getElementById('tEmail').value,
              password: document.getElementById('tPass').value,
              planId: document.getElementById('tPlan').value,
              days: Number(document.getElementById('tDays').value || 7),
              note: document.getElementById('tNote').value,
            }),
          })
          document.getElementById('trialMsg').textContent = 'OK trial ' + data.user.email + ' · ' + data.trialDays + ' hari'
          await loadUsers()
        } catch (e) {
          document.getElementById('trialMsg').textContent = e.message
        }
      }

      document.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = async () => {
          const id = document.getElementById('mUserId').value.trim()
          if (!id) return alert('User ID wajib')
          try {
            const data = await api('/api/admin/users/' + id + '/subscription', {
              method: 'POST',
              body: JSON.stringify({
                action: btn.getAttribute('data-act'),
                planId: document.getElementById('mPlan').value,
                days: Number(document.getElementById('mDays').value || 30),
              }),
            })
            document.getElementById('manualMsg').textContent = JSON.stringify(data.subscription)
            await loadUsers()
          } catch (e) {
            document.getElementById('manualMsg').textContent = e.message
          }
        }
      })

      ;(async () => {
        const showLogin = () => {
          document.getElementById('loginCard').style.display = 'block'
          document.getElementById('app').style.display = 'none'
        }
        if (!token) {
          showLogin()
          return
        }
        try {
          const me = await api('/api/auth/me')
          const user = me.user || me
          if (user.role !== 'admin') throw new Error('not admin')
          document.getElementById('loginCard').style.display = 'none'
          document.getElementById('app').style.display = 'grid'
          await loadUsers()
        } catch {
          token = ''
          localStorage.removeItem(key)
          showLogin()
        }
      })()
    </script>
  </body>
</html>
